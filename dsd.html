<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="dd.css">
</head>
<body>
<div class="card">
    <div class="search">
        <input type="text" placeholder="Enter City Name" spellcheck="false">
        <button><img src="https://static.vecteezy.com/system/resources/thumbnails/009/652/218/small_2x/magnifying-glass-icon-isolated-on-white-background-search-illustration-vector.jpg" height="30px" width="30px"></button>
    </div>
    <div class="error">
        <P>Invalid City Name</P>
    </div>
    <div class="weather">
        <img src="https://png.pngtree.com/png-clipart/20230522/original/pngtree-weather-vector-png-image_9167000.png" class="weather-icon" height="200px" width="200px">
        <h1 class="temp">22°C</h1>
        <h2 class="city">New York</h2>
        <div class="details">

            <div class="col">
                <img src="https://cdn4.iconfinder.com/data/icons/weather-outlines-icon-set/142/mist-512.png" height="150px" width="200px">
                <div>
                    <p class="humidity">50%</p>
                    <p> humidity</p>
                    
                </div>
            </div>

            <div class="col">
                <img src="https://cdn-icons-png.flaticon.com/512/182/182272.png" height="150px" width="160px">
                <div>
                    <p class="wind">15 km/h</p>
                    <p> wind speed</p>
                </div>
            </div>

        </div>
    </div>
</div>


    <script>
        const apikey ="9bf62dc899baf112a50051e3f7e0bb95";
        const apiUrl= "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

        const searchbox = document.querySelector(".search input ");
        const searchbtn = document.querySelector(".search button");
        const weathericon = document.querySelector(".weather-icon");
       
        async function checkweather(city) {
            const response = await fetch(apiUrl + city + `&appid=${apikey}`);

       if(response.status== 404){
        document.querySelector(".error").style.display= "block";
        document.querySelector(".weather").style.display= "none";
       }else{

       

            var data = await response.json();
            

            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".temp").innerHTML = Math.round(data.main .temp) + "°C";
          document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
          document.querySelector(".wind").innerHTML = data.wind.speed + " km/h";
         
          if(data.weather[0].main == "clouds"){
            weathericon.src = "https://cdn-icons-png.flaticon.com/512/10127/10127236.png";
          }
          else if(data.weather[0].main == "clear"){
             weathericon.src = "https://cdn-icons-png.flaticon.com/512/1779/1779940.png";
          }
          else if(data.weather[0].main == "rain"){
             weathericon.src = "https://cdn-icons-png.flaticon.com/512/1779/1779940.png";
          }
          else if(data.weather[0].main == "drizzle"){
             weathericon.src = "https://www.freeiconspng.com/thumbs/weather-icon-png/weather-icon-png-2.png";
          }
          else if(data.weather[0].main == "mist"){
             weathericon.src = "https://cdn-icons-png.flaticon.com/512/1779/1779940.png";
          }
          document.querySelector(".weather").style.display = "block";
          ocument.querySelector(".error").style.display = "none";
        }
        }  
        
        searchbtn.addEventListener("click", ()=>{
           checkweather(searchbox.value);
        })
        
    </script>
</body>
</html>
